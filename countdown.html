<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ForeThought Countdown</title>
  <meta name="description" content="The Road to Scratch countdown to 30 September 2027." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23071d16'/%3E%3Cpath d='M16 17h34v9H27v8h18v9H27v16H16z' fill='%2380e0a7'/%3E%3C/svg%3E" />

  <style>
    :root {
      --ink: #10281f;
      --forest: #123c2d;
      --forest-deep: #071d16;
      --paper: #f4f0e5;
      --paper-deep: #e9e4d7;
      --white: #fffdf7;
      --lime: #80e0a7;
      --lime-dark: #19764a;
      --muted: #607168;
      --line: rgba(16, 40, 31, .16);
      --shadow: 0 28px 80px rgba(7, 29, 22, .20);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--white);
      background:
        linear-gradient(rgba(16, 40, 31, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 40, 31, .045) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      position: relative;
      width: min(1040px, 100%);
      padding: clamp(24px, 5vw, 56px);
      overflow: hidden;
      border: 1px solid rgba(128, 224, 167, .24);
      border-radius: 30px;
      background: var(--forest-deep);
      box-shadow: var(--shadow);
    }

    .wrap::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      top: -310px;
      right: -180px;
      border: 1px solid rgba(128, 224, 167, .24);
      border-radius: 50%;
      box-shadow:
        0 0 0 54px rgba(128, 224, 167, .035),
        0 0 0 108px rgba(128, 224, 167, .02);
      pointer-events: none;
    }

    header,
    .hero,
    footer { position: relative; z-index: 1; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: clamp(38px, 7vw, 72px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .mark {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 14px;
      color: var(--forest-deep);
      background: var(--lime);
      box-shadow: inset 0 -5px 0 rgba(7, 29, 22, .10);
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .brandText {
      min-width: 0;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brandTitle {
      overflow: hidden;
      color: var(--white);
      font-size: 1.08rem;
      font-weight: 850;
      letter-spacing: -.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brandSub {
      margin-top: 5px;
      color: rgba(255, 255, 255, .56);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .pill {
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      color: rgba(255, 255, 255, .70);
      background: rgba(255, 255, 255, .055);
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .hero { padding: 0; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--lime);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0 0 14px;
      color: var(--white);
      font-size: clamp(2.8rem, 8vw, 6.7rem);
      line-height: .96;
      letter-spacing: -.06em;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, .66);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.55;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: clamp(28px, 5vw, 48px);
    }

    .card {
      min-width: 0;
      padding: clamp(18px, 3vw, 28px) clamp(14px, 2.5vw, 22px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .16);
    }

    .card:first-child { background: var(--lime); }

    .num {
      overflow: hidden;
      color: var(--forest-deep);
      font-size: clamp(2.25rem, 6vw, 4.4rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.055em;
      text-overflow: ellipsis;
    }

    .lbl {
      margin-top: 12px;
      color: var(--muted);
      font-size: .73rem;
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .card:first-child .lbl { color: rgba(7, 29, 22, .64); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
      color: rgba(255, 255, 255, .50);
      font-size: .79rem;
      font-weight: 650;
    }

    a {
      color: var(--lime);
      text-decoration-color: rgba(128, 224, 167, .45);
      text-underline-offset: .22em;
    }

    a:hover { color: var(--white); }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .wrap { border-radius: 22px; }
      header { align-items: flex-start; }
      .pill { max-width: 145px; overflow: hidden; text-overflow: ellipsis; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 390px) {
      .pill { display: none; }
      .grid { gap: 8px; }
      .card { border-radius: 16px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">FT</div>
        <div class="brandText">
          <div class="brandTitle">Road to Scratch</div>
          <div class="brandSub">ForeThought Countdown</div>
        </div>
      </div>

      <div class="pill" id="todayPill">Today: …</div>
    </header>

    <section class="hero">
      <div class="eyebrow">The finish line</div>
      <h1>30 September 2027</h1>
      <p>Counting down the days remaining in corporate life.</p>

      <div class="grid" aria-label="Countdown">
        <div class="card"><div class="num" id="days">—</div><div class="lbl">Days</div></div>
        <div class="card"><div class="num" id="hours">—</div><div class="lbl">Hours</div></div>
        <div class="card"><div class="num" id="minutes">—</div><div class="lbl">Minutes</div></div>
        <div class="card"><div class="num" id="seconds">—</div><div class="lbl">Seconds</div></div>
      </div>
    </section>

    <footer>
      <div id="targetLine">Target: …</div>
      <div><a href="/" aria-label="Back to site">Back to ForeThought</a></div>
    </footer>
  </main>

  <script>
    // Target date: 30 September 2027 at 17:00:00 local time
    const target = new Date(2027, 8, 30, 17, 0, 0); // months are 0-based (8 = September)

    const el = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
      todayPill: document.getElementById("todayPill"),
      targetLine: document.getElementById("targetLine"),
    };

    const pad2 = (n) => String(n).padStart(2, "0");

    function tick(){
      const now = new Date();
      let diffMs = target - now;

      el.todayPill.textContent = `Today: ${now.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" })}`;
      el.targetLine.textContent = `Target: ${target.toLocaleString()}`;

      if (diffMs <= 0){
        el.days.textContent = "0";
        el.hours.textContent = "00";
        el.minutes.textContent = "00";
        el.seconds.textContent = "00";
        el.targetLine.textContent = "It’s here 🎉";
        return;
      }

      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      el.days.textContent = days;
      el.hours.textContent = pad2(hours);
      el.minutes.textContent = pad2(minutes);
      el.seconds.textContent = pad2(seconds);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
