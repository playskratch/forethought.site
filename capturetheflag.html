<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForeThought – Green Capture Admin</title>

<link rel="stylesheet" href="style.css" />
<link rel="icon" href="forethought-lab-logo.png" type="image/png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body{
  margin:0;
  padding:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f0e5;
  color:#10281f;
}

.capture-app{
  width:min(760px,calc(100% - 28px));
  margin:0 auto;
  padding:42px 0 90px;
}

.capture-kicker{
  margin:0 0 .35rem;
  color:#19764a;
  text-align:center;
  font-size:.76rem;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

h1{
  text-align:center;
  font-weight:800;
  font-size:clamp(2.5rem,8vw,4.8rem);
  color:#123c2d;
  margin:0 0 1rem;
}

.card{
  background:white;
  border-radius:16px;
  padding:1rem;
  margin:.75rem auto;
  max-width:700px;
  border:1px solid rgba(16,40,31,.12);
  background:#fffdf7;
  box-shadow:0 14px 36px rgba(15,48,37,.10);
}

button{
  width:100%;
  padding:.75rem;
  border-radius:12px;
  font-weight:800;
  border:none;
  margin-top:.5rem;
  background:#123c2d;
  color:white;
}

button.secondary{
  background:#e9e4d7;
  color:#123c2d;
}

#map{
  height:min(52vh,480px);
  border-radius:16px;
  margin:1rem auto;
  max-width:700px;
  overflow:hidden;
  border:1px solid rgba(16,40,31,.12);
  box-shadow:0 14px 36px rgba(15,48,37,.10);
}

#status{
  text-align:center;
  font-weight:800;
  margin-top:.5rem;
}

.capture-back{
  display:block;
  width:max-content;
  margin:18px auto 0;
  color:#19764a;
  font-weight:800;
  text-decoration:none;
}
</style>
</head>

<body class="page-capture">

<nav class="topnav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="index.html" class="brand" aria-label="ForeThought home"><img src="forethought-lab-logo.png" alt=""><span>ForeThought<small>Golf Performance Hub</small></span></a>
    </div>
    <div class="nav-right">
      <a href="yardagebook.html">Yardage Builder</a>
      <a href="cheadle.html">Cheadle Yardages</a>
      <a href="capturetheflag.html" class="active">Green Capture</a>
      <a href="support.html">Support</a>
    </div>
  </div>
</nav>

<main class="capture-app">

<p class="capture-kicker">ForeThought Course Tools</p>
<h1>Green Capture</h1>

<div class="card">
  <select id="holeSelect" style="width:100%;padding:.7rem;border:1px solid rgba(16,40,31,.18);border-radius:12px;background:white;font:inherit;">
    <option value="">Select Hole</option>
    <option value="1">Hole 1</option>
    <option value="2">Hole 2</option>
    <option value="3">Hole 3</option>
    <option value="4">Hole 4</option>
    <option value="5">Hole 5</option>
    <option value="6">Hole 6</option>
    <option value="7">Hole 7</option>
    <option value="8">Hole 8</option>
    <option value="9">Hole 9</option>
  </select>

  <button onclick="setMode('centre')">Capture Centre</button>
  <button onclick="setMode('front')">Capture Front</button>
  <button onclick="setMode('back')">Capture Back</button>

  <button onclick="setMode('edge')" class="secondary">Add Green Edge Point</button>
  <button onclick="clearEdges()" class="secondary">Clear Outline</button>

  <button onclick="exportJSON()">Export Course JSON</button>
</div>

<div id="map"></div>

<div id="status">Mode: None</div>

<a class="capture-back" href="cheadle.html">← Return to the Cheadle yardage book</a>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = L.map("map").setView([53.387, -2.205], 17);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19
}).addTo(map);

let currentMode = null;
let currentHole = null;

let courseData = {};
let edgePoints = [];
let edgeLayer = null;

function setMode(mode){
  currentMode = mode;
  currentHole = document.getElementById("holeSelect").value;
  if(!currentHole) return alert("Select hole first");

  if(!courseData[currentHole]) courseData[currentHole] = {};
  document.getElementById("status").textContent = "Mode: " + mode;
}

navigator.geolocation.watchPosition(
  pos=>{
    const {latitude, longitude} = pos.coords;

    if(currentMode && currentHole){

      if(currentMode === "centre"){
        courseData[currentHole].green = {lat:latitude, lng:longitude};
      }

      if(currentMode === "front"){
        courseData[currentHole].greenFront = {lat:latitude, lng:longitude};
      }

      if(currentMode === "back"){
        courseData[currentHole].greenBack = {lat:latitude, lng:longitude};
      }

      if(currentMode === "edge"){
        edgePoints.push([latitude, longitude]);
        drawEdges();
        courseData[currentHole].greenShape = edgePoints;
      }
    }
  },
  err=>console.warn(err),
  {enableHighAccuracy:true}
);

function drawEdges(){
  if(edgeLayer) map.removeLayer(edgeLayer);
  edgeLayer = L.polygon(edgePoints, {
    color:"#19764a",
    fillOpacity:0.2
  }).addTo(map);
}

function clearEdges(){
  edgePoints = [];
  if(edgeLayer) map.removeLayer(edgeLayer);
  if(currentHole && courseData[currentHole]){
    delete courseData[currentHole].greenShape;
  }
}

function exportJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(courseData, null, 2));
  const dl = document.createElement("a");
  dl.setAttribute("href", dataStr);
  dl.setAttribute("download", "green-data.json");
  document.body.appendChild(dl);
  dl.click();
  dl.remove();
}
</script>

</body>
</html>
